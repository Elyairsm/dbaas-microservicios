version: "3.9"

networks:
  dbaas_net:
    driver: bridge

volumes:
  rabbitmq_data:

services:

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: dbaas_rabbitmq
    networks: [dbaas_net]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: dbaas
      RABBITMQ_DEFAULT_PASS: dbaas123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  query-service:
    build:
      context: .
      dockerfile: query_service/Dockerfile
    container_name: dbaas_query
    networks: [dbaas_net]
    ports:
      - "50054:50054"
    environment:
      GRPC_PORT: 50054
      AUTH_SERVICE_ADDR: 192.168.1.79:50051
      STORAGE_SERVICE_ADDR: 192.168.1.79:50053
      AGGREGATION_SERVICE_ADDR: aggregation-service:50055
      RABBITMQ_URL: "amqp://dbaas:dbaas123@rabbitmq:5672/"
      LOG_LEVEL: DEBUG
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  aggregation-service:
    build:
      context: .
      dockerfile: aggregation_service/Dockerfile
    container_name: dbaas_aggregation
    networks: [dbaas_net]
    ports:
      - "50055:50055"
    environment:
      GRPC_PORT: 50055
      STORAGE_SERVICE_ADDR: 192.168.1.79:50053
      RABBITMQ_URL: "amqp://dbaas:dbaas123@rabbitmq:5672/"
      MPI_WORKERS: 4
      LOG_LEVEL: DEBUG
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: dbaas_gateway
    networks: [dbaas_net]
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_ADDR: 192.168.1.79:50051
      ADMIN_SERVICE_ADDR: 192.168.1.79:50052
      QUERY_SERVICE_ADDR: query-service:50054
      LOG_LEVEL: DEBUG
    depends_on:
      - query-service
    restart: unless-stopped

  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: dbaas_dozzle_agent_mac
    networks: [dbaas_net]
    ports:
      - "7007:7007"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: agent
    restart: unless-stopped

  dozzle-ui:
    image: amir20/dozzle:latest
    container_name: dbaas_dozzle_ui
    networks: [dbaas_net]
    ports:
      - "8888:8080"
    environment:
      DOZZLE_REMOTE_AGENT: "dbaas_dozzle_agent_mac:7007|Mac,192.168.1.79:7007|Ubuntu"
    depends_on:
      - dozzle-agent
    restart: unless-stopped