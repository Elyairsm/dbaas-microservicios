# ══════════════════════════════════════════════════════
#  UBUNTU (192.168.1.79) — Capa de datos
#  Servicios: Auth + Admin + Storage
#  Comando: docker compose -f docker-compose.ubuntu.yml up --build
# ══════════════════════════════════════════════════════

networks:
  dbaas_ubuntu:
    driver: bridge

volumes:
  auth_data:
  storage_data:

services:

  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: dbaas_auth
    networks: [dbaas_ubuntu]
    ports:
      - "50051:50051"    # accesible desde Mac
    environment:
      GRPC_PORT: 50051
      JWT_SECRET: "change_me_in_production"
      JWT_EXPIRY_HOURS: 24
      DATA_DIR: /app/data
    volumes:
      - auth_data:/app/data
    restart: unless-stopped

  storage-service:
    build:
      context: .
      dockerfile: storage_service/Dockerfile
    container_name: dbaas_storage
    networks: [dbaas_ubuntu]
    ports:
      - "50053:50053"    # accesible desde Mac
    environment:
      GRPC_PORT: 50053
      DATA_DIR: /app/data
    volumes:
      - storage_data:/app/data
    restart: unless-stopped

  admin-service:
    build:
      context: .
      dockerfile: admin_service/Dockerfile
    container_name: dbaas_admin
    networks: [dbaas_ubuntu]
    ports:
      - "50052:50052"    # accesible desde Mac
    environment:
      GRPC_PORT: 50052
      AUTH_SERVICE_ADDR: auth-service:50051
      STORAGE_SERVICE_ADDR: storage-service:50053
      DATA_DIR: /app/data
    volumes:
      - storage_data:/app/data
    depends_on:
      - auth-service
      - storage-service
    restart: unless-stopped
