syntax = "proto3";
package query;

import "google/protobuf/struct.proto";

service QueryService {
  rpc ExecuteSQL   (SQLRequest)   returns (QueryResponse);
  rpc ExecuteNoSQL (NoSQLRequest) returns (QueryResponse);
}

// ── SQL-like interface ──────────────────────────────────────────────
// Accepts raw SQL strings:
//   SELECT, INSERT INTO, UPDATE, DELETE FROM
//   + aggregation: COUNT(*), SUM(col), AVG(col), DISTINCT col
//   + INNER JOIN table2 ON t1.col = t2.col
message SQLRequest {
  string sql   = 1;
  string token = 2;
}

// ── NoSQL-like interface (JSON document) ───────────────────────────
// operation: "insert" | "find" | "update" | "delete" | "aggregate"
//
// Examples:
//   insert  → payload: { "record": { ... } }
//   find    → payload: { "filter": { "age": 30 } }
//   update  → payload: { "filter": { "id": 1 }, "updates": { "age": 31 } }
//   delete  → payload: { "filter": { "id": 1 } }
//   aggregate → payload: { "op": "COUNT", "field": "id", "filter": {} }
message NoSQLRequest {
  string                 db_name    = 1;
  string                 collection = 2;
  string                 operation  = 3;
  google.protobuf.Struct payload    = 4;
  string                 token      = 5;
}

message QueryResponse {
  bool                            success       = 1;
  repeated google.protobuf.Struct rows          = 2;
  int32                           affected_rows = 3;
  string                          message       = 4;
}
