syntax = "proto3";
package aggregation;

import "google/protobuf/struct.proto";

service AggregationService {
  rpc Aggregate (AggregateRequest) returns (AggregateResponse);
}

enum AggregateOp {
  COUNT      = 0;
  SUM        = 1;
  AVG        = 2;
  DISTINCT   = 3;
  INNER_JOIN = 4;
}

// Used only when operation = INNER_JOIN
message JoinConfig {
  string right_db    = 1;
  string right_table = 2;
  string left_key    = 3;
  string right_key   = 4;
}

message AggregateRequest {
  string                 db_name    = 1;
  string                 table_name = 2;
  AggregateOp            operation  = 3;
  string                 field      = 4;  // column for SUM / AVG / DISTINCT
  google.protobuf.Struct filter     = 5;  // optional WHERE clause
  JoinConfig             join       = 6;  // only for INNER_JOIN
  string                 token      = 7;
}

message AggregateResponse {
  bool                            success       = 1;
  double                          scalar_result = 2;  // COUNT / SUM / AVG
  repeated google.protobuf.Struct rows          = 3;  // DISTINCT / INNER_JOIN
  string                          message       = 4;
}
